<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The genie game</title>

  <!-- Vendored KaTeX and d3. There is no CDN reference anywhere on this page
       and no fetch anywhere in the folder: the whole thing has to open from
       file:// on a lecturer's laptop with no network. -->
  <link rel="stylesheet" href="vendor/katex.min.css">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/table.css">
  <link rel="stylesheet" href="css/trace.css">
  <link rel="stylesheet" href="css/scene0.css">
  <link rel="stylesheet" href="css/scene1.css">
  <link rel="stylesheet" href="css/scene3.css">
  <link rel="stylesheet" href="css/scene6.css">
  <link rel="stylesheet" href="css/scene7.css">
  <link rel="stylesheet" href="css/scene8.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">The genie game</span>
      <span class="brand-sub">Robbins-Monro</span>
    </div>
    <div id="scene-title" class="scene-title">loading</div>
    <div class="topbar-right right-cluster">
      <nav id="dot-pager" class="dot-pager" aria-label="Scenes"></nav>
      <button class="theme-toggle" id="theme-toggle" type="button">Dark</button>
    </div>
  </header>

  <main id="stage" class="stage"></main>

  <footer class="page-footer">
    <div class="footer-inner">
      <button id="prev-btn" class="btn btn-ghost" type="button">Prev</button>
      <button id="next-btn" class="btn" type="button">Next</button>
      <span>CAS BMAI, weekend 1</span>
      <span class="footer-dot">.</span>
      <span>Act 2, the genie game</span>
      <span class="footer-hint">Press <kbd>t</kbd> to switch theme, arrow keys to step</span>
    </div>
  </footer>

  <!-- Script order is load-bearing.
       theme first, so data-theme is stamped on <html> before anything
       measures a colour; then the vendored libraries; then the generated
       data; then the shared modules in dependency order (rng before genie
       before loop); then the scenes, each of which only registers itself on
       window.scenes; then the engine, which is the only file that touches
       the DOM at load. -->
  <script src="vendor/katex.min.js"></script>
  <script src="vendor/d3.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="data/datasets.js"></script>

  <script src="js/katex-helpers.js"></script>
  <script src="js/history.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/genie.js"></script>
  <script src="js/schedules.js"></script>
  <script src="js/loop.js"></script>
  <script src="js/table.js"></script>
  <script src="js/trace.js"></script>
  <script src="js/stub.js"></script>

  <script src="js/scenes/scene0.js"></script>
  <script src="js/scenes/scene1.js"></script>
  <script src="js/scenes/scene2.js"></script>
  <script src="js/scenes/scene3.js"></script>
  <script src="js/scenes/scene4.js"></script>
  <script src="js/scenes/scene5.js"></script>
  <script src="js/scenes/scene6.js"></script>
  <script src="js/scenes/scene7.js"></script>
  <script src="js/scenes/scene8.js"></script>

  <script src="js/main.js"></script>
</body>
</html>
