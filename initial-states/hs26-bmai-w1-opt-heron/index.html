<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squaring the rectangle</title>

  <!-- Vendored KaTeX. No CDN anywhere on this page: the whole folder has to
       open from file:// on a lecturer's laptop with no network. -->
  <link rel="stylesheet" href="vendor/katex.min.css">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/scene0.css">
  <link rel="stylesheet" href="css/scene1.css">
  <link rel="stylesheet" href="css/scene2.css">
  <link rel="stylesheet" href="css/scene3.css">
  <link rel="stylesheet" href="css/scene4.css">
  <link rel="stylesheet" href="css/scene5.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Squaring the rectangle</span>
    </div>
    <div id="scene-title" class="scene-title">loading</div>
    <div class="topbar-right">
      <nav id="dot-pager" class="dot-pager" aria-label="Scenes"></nav>
      <button class="theme-toggle" id="theme-toggle" type="button">Dark</button>
    </div>
  </header>

  <main id="stage" class="stage"></main>

  <footer class="page-footer">
    <div class="footer-inner">
      <button id="prev-btn" class="btn btn-ghost" type="button">Prev</button>
      <button id="next-btn" class="btn" type="button">Next</button>
      <span class="footer-sep"></span>
      <span>CAS BMAI, weekend 1</span>
      <span class="footer-dot">.</span>
      <span>Act 1, Heron's algorithm</span>
      <span class="footer-hint">Press <kbd>t</kbd> for dark mode, arrow keys to step</span>
    </div>
  </footer>

  <!-- Script order is load-bearing. theme first so data-theme is stamped on
       <html> before anything measures a colour; then the vendored library;
       then the data; then the shared modules; then the scenes, each of which
       only registers itself on window.scenes; then the engine, which is the
       only file that touches the DOM at load. -->
  <script src="vendor/katex.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="data/datasets.js"></script>
  <script src="js/katex-helpers.js"></script>
  <script src="js/heron.js"></script>
  <script src="js/rectview.js"></script>
  <script src="js/stub.js"></script>
  <script src="js/scenes/scene0.js"></script>
  <script src="js/scenes/scene1.js"></script>
  <script src="js/scenes/scene2.js"></script>
  <script src="js/scenes/scene3.js"></script>
  <script src="js/scenes/scene4.js"></script>
  <script src="js/scenes/scene5.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
